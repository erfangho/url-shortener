name: CI
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Enable debug logging'
        default: false
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  GO_VERSION: '1.27'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - run: echo "Hello from GitHub Actions"
      - run: echo "Go version:$GO_VERSION"
      - run: uname -s -r -m