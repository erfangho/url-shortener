name: CI
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Enable debug logging'
        default: false
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        id: swag-cache
        with:
          path: /home/runner/go/bin/swag
          key: swag-${{ runner.os }}-v1.16.6
      - if: steps.swag-cache.outputs.cache-hit != 'true'
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - run: swag init -g cmd/server/main.go --parseInternal --parseDependency
      - run: go build ./...

  test:
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ '1.27', '1.26.4', '1.25' ]
        experimental: [ false ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - shell: bash
        run: echo "GO_BIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: swag-cache
        with:
          path: ${{ env.GO_BIN }}
          key: swag-${{ runner.os }}-${{ matrix.go-version }}-v1.16.6
      - if: steps.swag-cache.outputs.cache-hit != 'true'
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - run: swag init -g cmd/server/main.go --parseInternal --parseDependency
      - run: go test -race ./...

  ci:
    needs: [ build, test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "CI gate failed"
            exit 1
          fi
          
  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/erfangho/url-shortener:${{ github.sha }}
            docker rm -f url-shortener || true
            docker run -d --name url-shortener -p 80:8080 -e REDIS_ADDR=redis:6379 ghcr.io/erfangho/url-shortener:${{ github.sha }}
